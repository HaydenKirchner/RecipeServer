services:
  backend:
    build:
      context: ./backend
    environment:
      FLASK_APP: app:create_app
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - backend-instance:/app/instance
      - backend-uploads:/app/uploads
      - backend-images:/app/images
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  backend-instance:
  backend-uploads:
  backend-images:
